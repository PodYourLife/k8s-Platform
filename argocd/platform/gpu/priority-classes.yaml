# Cluster-scoped PriorityClasses for GPU workloads.
#
# A pod referencing a missing PriorityClass is rejected at admission, so the
# consuming Job fails to apply and converges by retry once this ApplicationSet
# has synced (ADR-0023). GPU Jobs are on-demand, long after bootstrap.
#
# These resources are platform-owned (cluster-scoped) and therefore
# cannot live in the chart-owned ml AppProject (whose
# clusterResourceWhitelist is empty). The platform AppProject scope
# owns them via this dedicated ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: priority-classes
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'priority-classes-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: '{{.repoUrl}}'
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/manifests/priority-classes
        directory:
          recurse: false
      destination:
        # PriorityClasses are cluster-scoped — destination namespace is
        # ignored by the API but ArgoCD requires the field. kube-system
        # is the conventional placeholder for cluster-scoped manifests.
        server: https://kubernetes.default.svc
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
