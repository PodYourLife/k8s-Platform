# Installs the Istio CNI plugin
# CNI handles iptables rules at the node level instead of via init containers
# Required to avoid NET_ADMIN privilege on app pods (PodSecurity compliance)
# Must sync before istiod
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: __ISTIO_VERSION__
    helm:
      releaseName: istio-cni

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      refresh: true
    syncOptions:
      - ServerSideApply=true
