# Deploys Istio traffic management config via the internal Helm chart
# Generates VirtualServices, DestinationRules and AuthorizationPolicies
# from the app list defined in istio/helm/values.yaml
# To add a new app to the mesh: edit istio/helm/values.yaml
# Depends on: istio-gateway, istio-security
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: istio-mesh-config
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'istio-mesh-config-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: '{{.repoUrl}}'
        targetRevision: '{{.targetRevision}}'
        path: istio/helm
      destination:
        server: https://kubernetes.default.svc
        namespace: istio-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true  # CRD owned by another Application (ADR-0023 D3)
