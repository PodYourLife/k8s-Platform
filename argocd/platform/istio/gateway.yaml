# Installs the Istio ingress gateway
# Entry point for all external traffic into the mesh
# Depends on: istiod (injection webhook) + istio-cni
#
# Deployed in istio-ingress namespace (istio-injection: enabled).
# The gateway pod uses image: auto — substituted at creation time
# by the istio-sidecar-injector MutatingAdmissionWebhook.
# If gateway pods are created before the webhook exists, they stay in
# ImagePullBackOff: retry cannot fix an applied object. Known case ADR-0023 D5,
# removed by the Gateway API migration (ADR-0001 A1). Until then: alert (D4)
# then `kubectl -n istio-ingress rollout restart deployment`.
#
# Default service type: LoadBalancer
# EKS: cloud NLB provisioned automatically via AWS Load Balancer Controller
# Kind: NodePort mapped to host port 80/443 via Kind cluster config
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: __ISTIO_VERSION__
    helm:
      releaseName: istio-ingressgateway
      values: |
        # HA configuration — minimum 2 replicas for zero-downtime upgrades
        replicaCount: 2

        autoscaling:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          targetCPUUtilizationPercentage: 80

        # PodDisruptionBudget — at least 1 replica always available
        podDisruptionBudget:
          minAvailable: 1

        service:
          type: LoadBalancer
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
            service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      refresh: true
    syncOptions:
      - ServerSideApply=true