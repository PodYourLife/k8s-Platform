# Installs Istio base CRDs and cluster-wide resources
# Must sync before istiod — istiod depends on these CRDs
# Chart: https://istio-release.storage.googleapis.com/charts
# Version: __ISTIO_VERSION__ — resolved by platform-bot env hydrate from platform.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: __ISTIO_VERSION__
    helm:
      releaseName: istio-base

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      refresh: true
    syncOptions:
      - ServerSideApply=true


  # Both Istio validators drift their failurePolicy at runtime (Fail → Ignore)
  # ArgoCD would otherwise report OutOfSync on every reconcile loop
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istiod-default-validator
      jsonPointers:
        - /webhooks/0/failurePolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jsonPointers:
        - /webhooks/0/failurePolicy