# Manages all cluster namespaces via GitOps
# Namespaces include PodSecurity labels and Istio injection labels
# Any namespace change must go through this ApplicationSet — no manual kubectl create namespace
#
# Every other Application uses CreateNamespace=false (ADR-0002): its sync fails
# until the namespace exists, then converges by retry (ADR-0023). Namespaces are
# therefore always created with their labels (e.g. monitoring carries
# istio-injection: disabled), never implicitly without them.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: namespaces
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'namespaces-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      ignoreDifferences:
        - group: ""
          kind: Namespace
          jsonPointers:
            - /metadata/annotations
      source:
        repoURL: '{{.repoUrl}}'
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/namespaces
      destination:
        server: https://kubernetes.default.svc
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
