# Deploys ServiceMonitors for ArgoCD components
# Covers: argocd-metrics, argocd-server-metrics, argocd-repo-server
# ServiceMonitors live in the argocd namespace but are scraped by Prometheus
# in the monitoring namespace (cross-namespace scraping enabled via namespaceSelector: any: true)
#
# Depends on: ServiceMonitor CRD (prometheus Application). Converges by retry once it exists (ADR-0023).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-servicemonitors
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'argocd-servicemonitors-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: '{{.repoUrl}}'
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/manifests/argocd/servicemonitors
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true  # CRD owned by another Application (ADR-0023 D3)
