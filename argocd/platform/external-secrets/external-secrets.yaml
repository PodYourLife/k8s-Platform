# External Secrets Operator — bridge between Kubernetes and AWS Secrets Manager
# Provides the ExternalSecret CRDs: consumers converge by retry once they exist (ADR-0023).
# IRSA annotation on the ESO service account is injected per-env via the generator
# SecretStore is created post-install by platform-bot new-cluster
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
  template:
    metadata:
      name: 'external-secrets-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://charts.external-secrets.io
        targetRevision: __EXTERNAL_SECRETS_VERSION__
        chart: external-secrets
        helm:
          # releaseName must be the literal "external-secrets" — the default
          # ArgoCD release name is the Application name (external-secrets-{{.env}})
          # which propagates to the ESO controller ServiceAccount via {{ .Release.Name }}.
          # ClusterSecretStore manifests reference `serviceAccountRef.name: external-secrets`,
          # so env-suffixed SAs break the AWS Secrets Manager JWT auth binding.
          releaseName: external-secrets
          values: |
            installCRDs: true
            webhook:
              create: true
            certController:
              create: true
            serviceAccount:
              annotations:
                eks.amazonaws.com/role-arn: '{{.esoIrsaRoleArn}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
