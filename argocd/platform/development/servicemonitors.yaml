# Depends on: ServiceMonitor CRD (prometheus Application). Converges by retry once it exists (ADR-0023).

# This ApplicationSet is intentionally minimal in the template — it covers
# the sample-app fixture used to validate the infra during bootstrap.
#
# When platform-bot onboards a new app with --monitor, it generates a
# ServiceMonitor manifest in kubernetes/manifests/<namespace>/servicemonitors/
# and commits it to the target repo. ArgoCD prune: true will pick it up
# automatically on the next sync — no changes needed here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: development-servicemonitors
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'development-servicemonitors-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: '{{.repoUrl}}'
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/manifests/development/servicemonitors
      destination:
        server: https://kubernetes.default.svc
        namespace: development
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true  # CRD owned by another Application (ADR-0023 D3)
