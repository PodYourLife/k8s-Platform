# Kyverno ClusterPolicies — deployed after Kyverno CRDs are available
# Depends on: ClusterPolicy/PolicyException CRDs (kyverno Application). Converges by retry once it exists (ADR-0023).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: __REPO_URL__
    targetRevision: __TARGET_REVISION__
    path: kubernetes/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      refresh: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true  # CRD owned by another Application (ADR-0023 D3)
