# Kyverno policy engine — validates and mutates resources against ClusterPolicies
# Depends on: the kyverno namespace. Policies (kyverno-policies) converge by retry
# once its CRDs exist (ADR-0023).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: __KYVERNO_VERSION__
    helm:
      releaseName: kyverno
      values: |
        # bitnami/kubectl is no longer published on docker.io for recent tags.
        # Override all cleanup job images to use the official Kyverno CLI image
        # from ghcr.io which is guaranteed to exist for each Kyverno release.
        cleanupJobs:
          admissionReports:
            image:
              registry: ghcr.io
              repository: kyverno/kyverno-cli
              tag: v1.13.4
          clusterAdmissionReports:
            image:
              registry: ghcr.io
              repository: kyverno/kyverno-cli
              tag: v1.13.4
        # policyReportsCleanup is a Helm post-upgrade hook — separate from cleanupJobs
        policyReportsCleanup:
          image:
            registry: ghcr.io
            repository: kyverno/kyverno-cli
            tag: v1.13.4
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
      refresh: true
    syncOptions:
      - ServerSideApply=true
