# OpenCost — CNCF open source Kubernetes cost monitoring
# Namespace: finops (created by argocd/platform/namespaces.yaml)
# Depends on: Prometheus (query endpoint) and the finops namespace.
# Converges by retry once they exist (ADR-0023).
#
# OpenCost scrapes Prometheus for resource usage and exposes cost metrics
# per namespace, deployment, pod and container. GPU node costs are tracked
# via the AWS pricing integration (cloud provider: aws, region per env).
#
# UI available at http://localhost:9090 (kubectl port-forward) or via Ingress.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: opencost
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'opencost-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        # OpenCost Helm chart — official CNCF chart repository
        - repoURL: https://opencost.github.io/opencost-helm-chart
          chart: opencost
          targetRevision: __OPENCOST_VERSION__
          helm:
            releaseName: opencost
            valueFiles:
              - $values/kubernetes/helm/monitoring/opencost-values.yaml
        # Values reference — pulled from the GitOps repo
        - repoURL: '{{.repoUrl}}'
          targetRevision: '{{.targetRevision}}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        # finops is the business domain namespace for cost monitoring tooling.
        # Created by the namespaces ApplicationSet — no CreateNamespace needed.
        namespace: finops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
