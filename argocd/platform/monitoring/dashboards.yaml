# Deploys all Grafana dashboard ConfigMaps
# Grafana sidecar (k8s-sidecar) watches for ConfigMaps with label grafana_dashboard=1
# and hot-reloads them into Grafana without restart
# To add a dashboard: add a JSON file in the relevant subfolder and update the ConfigMap
# Folder structure is driven by the annotation k8s-sidecar-target-directory
#
# Depends on: Grafana sidecar (prometheus Application). The sidecar watches
# ConfigMaps continuously, so dashboards applied first are loaded when it starts.
# ServerSideApply required — dashboard ConfigMaps exceed the 262144-byte annotation limit
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-dashboards
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'grafana-dashboards-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: '{{.repoUrl}}'
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/manifests/monitoring/dashboards
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
