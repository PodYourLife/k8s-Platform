# Deploys ServiceMonitors and PodMonitors for the monitoring namespace
# Covers: Loki, Promtail, Istio proxies (PodMonitor), Istio control plane
# Prometheus discovers these via its serviceMonitorNamespaceSelector: any: true config
# label release: prometheus must match the Prometheus operator selector
#
# Depends on: ServiceMonitor/PodMonitor CRDs (prometheus Application). Converges by retry once it exists (ADR-0023).
# Selectors resolve dynamically: targets appear when Loki and Promtail pods run.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring-servicemonitors
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'monitoring-servicemonitors-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: '{{.repoUrl}}'
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/manifests/monitoring/servicemonitors
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true  # CRD owned by another Application (ADR-0023 D3)
