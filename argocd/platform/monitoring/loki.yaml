# Installs Loki — log aggregation backend for Grafana
# Receives logs from Promtail agents running on each node
# Values file: kubernetes/helm/monitoring/loki-values.yaml
#
# Depends on: monitoring.coreos.com CRDs (prometheus Application) for the
# Loki ServiceMonitors. Converges by retry once it exists (ADR-0023).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: loki
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'loki-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://grafana.github.io/helm-charts
          chart: loki
          targetRevision: __LOKI_VERSION__
          helm:
            releaseName: loki
            valueFiles:
              - $values/kubernetes/helm/monitoring/loki-values.yaml
        - repoURL: '{{.repoUrl}}'
          targetRevision: '{{.targetRevision}}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
