# Installs Promtail — DaemonSet that ships pod logs to Loki
# Runs on every node, tails /var/log/pods and forwards to Loki
# Values file: kubernetes/helm/monitoring/promtail-values.yaml
#
# Depends on: Loki to receive logs. Promtail buffers and retries pushes on its own.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: promtail
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'promtail-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://grafana.github.io/helm-charts
          chart: promtail
          targetRevision: __PROMTAIL_VERSION__
          helm:
            releaseName: promtail
            valueFiles:
              - $values/kubernetes/helm/monitoring/promtail-values.yaml
        - repoURL: '{{.repoUrl}}'
          targetRevision: '{{.targetRevision}}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
