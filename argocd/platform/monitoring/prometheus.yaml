# argocd/platform/monitoring/prometheus.yaml
# Deploys the metrics collection stack.
# Installs: PrometheusOperator, Prometheus, Alertmanager, node-exporter, kube-state-metrics.
#
# Values split by responsibility (SRP):
#   prometheus-values.yaml → collection (Prometheus, Alertmanager, exporters, alert rules)
#   grafana-values.yaml    → visualisation (Grafana subchart, sidecar, persistence)
#
# Depends on: the monitoring namespace (namespaces ApplicationSet), created with
# istio-injection: disabled. Admission webhook Jobs cannot terminate cleanly with
# an Istio sidecar; CreateNamespace=false guarantees the namespace carries that
# label before any Job is created (ADR-0023).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometheus
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'prometheus-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: __PROMETHEUS_VERSION__
          helm:
            releaseName: prometheus
            valueFiles:
              - $values/kubernetes/helm/monitoring/prometheus-values.yaml
              - $values/kubernetes/helm/monitoring/grafana-values.yaml
        - repoURL: '{{.repoUrl}}'
          targetRevision: '{{.targetRevision}}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
