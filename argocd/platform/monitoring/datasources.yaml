# argocd/platform/monitoring/datasources.yaml
# Deploys Grafana datasource ConfigMaps.
# Each ConfigMap in kubernetes/manifests/monitoring/datasources/ declares
# a single datasource — the k8s-sidecar hot-loads them into Grafana without restart.
#
# Depends on: Grafana sidecar (prometheus Application). The sidecar loads
# existing ConfigMaps when it starts, so no ordering is required.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-datasources
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
            repoUrl: __REPO_URL__
  template:
    metadata:
      name: 'grafana-datasources-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: '{{.repoUrl}}'
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/manifests/monitoring/datasources
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
