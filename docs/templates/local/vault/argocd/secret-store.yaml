# Deploys the ClusterSecretStore that connects ESO to Vault.
# Depends on: Vault running and the ClusterSecretStore CRD (ESO). Converges by
# retry, and ESO re-validates the store until Vault answers (ADR-0023).
#
# On EKS, this ApplicationSet points to a different path containing
# the AWS Secrets Manager ClusterSecretStore (no Vault needed).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vault-secret-store
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - env: __ENV__
            targetRevision: __TARGET_REVISION__
            awsRegion: __AWS_REGION__
            esoIrsaRoleArn: __ESO_IRSA_ROLE_ARN__
  template:
    metadata:
      name: 'vault-secret-store-{{.env}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      source:
        repoURL: https://github.com/PodYourLife/k8s-platform.git
        targetRevision: '{{.targetRevision}}'
        path: kubernetes/manifests/vault
      destination:
        server: https://kubernetes.default.svc
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1  # retry until dependencies exist; non-convergence is alerted (ADR-0023 D4)
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          refresh: true
        syncOptions:
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true  # CRD owned by another Application (ADR-0023 D3)
