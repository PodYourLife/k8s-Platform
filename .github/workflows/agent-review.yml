# agent-review.yml
# Deterministic Terraform checks on the roots a PR touches, then an advisory
# review by Claude (skill .claude/skills/pr-reviewer). The `agent-review` job
# fails when the reviewer requests changes; the owner still merges by hand.
#
# terraform-checks runs on every push. The Claude review runs only when a PR is
# opened ready for review, when a draft is marked ready, or on demand by adding
# the `agent:review` label (removed automatically after the run).
name: Agent review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

env:
  TF_VERSION: "1.7.5"

jobs:
  terraform-checks:
    name: terraform-checks
    if: github.event.action != 'labeled' || github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-checks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List changed Terraform files and roots
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Files still present after the PR (deletions excluded).
          changed_tf_files=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" -- 'terraform/**.tf' | tr '\n' ' ')
          # A root is any changed directory with .tf files outside reusable modules.
          changed_roots=""
          for changed_dir in $(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'terraform/' | xargs -r -n1 dirname | sort -u); do
            case "$changed_dir" in terraform/_core/modules/*) continue ;; esac
            if compgen -G "$changed_dir/*.tf" > /dev/null; then
              changed_roots="$changed_roots $changed_dir"
            fi
          done
          echo "files=${changed_tf_files% }" >> "$GITHUB_OUTPUT"
          echo "roots=${changed_roots# }" >> "$GITHUB_OUTPUT"
          echo "Changed .tf files: ${changed_tf_files:-none}"
          echo "Changed roots: ${changed_roots:-none}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.changed.outputs.files != '' || steps.changed.outputs.roots != ''
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_TF_FILES: ${{ steps.changed.outputs.files }}
        run: |
          # shellcheck disable=SC2086 # word splitting on the file list is intended
          terraform fmt -check -diff $CHANGED_TF_FILES

      - name: terraform validate
        if: steps.changed.outputs.roots != ''
        env:
          CHANGED_ROOTS: ${{ steps.changed.outputs.roots }}
        run: |
          failed_roots=""
          for terraform_root in $CHANGED_ROOTS; do
            echo "::group::$terraform_root"
            if ! { terraform -chdir="$terraform_root" init -backend=false -input=false -no-color \
                && terraform -chdir="$terraform_root" validate -no-color; }; then
              failed_roots="$failed_roots $terraform_root"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed_roots" ]; then
            echo "::error::terraform validate failed for:$failed_roots"
            exit 1
          fi

  agent-review:
    name: agent-review
    needs: terraform-checks
    # Same-repo, non-draft PRs opened by humans only: fork PRs get no secrets,
    # and the action rejects bot actors. Skipped on plain pushes (synchronize).
    if: >-
      (github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
       (github.event.action == 'labeled' && github.event.label.name == 'agent:review')) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    # A push during a review must not cancel it: queue reviews instead.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require the Claude subscription token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Repository secret CLAUDE_CODE_OAUTH_TOKEN is missing (generate it with 'claude setup-token')."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The action restores .claude/ and CLAUDE.md from the base branch, so a PR
      # cannot rewrite the reviewer skill it is judged by. Without the skill on
      # the base branch Claude reviews with no rules: fail closed instead.
      - name: Require the reviewer skill on the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Also kept as origin/<base> so the reviewer can read base-branch ADRs.
          git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if ! git cat-file -e "origin/$BASE_REF:.claude/skills/pr-reviewer/SKILL.md"; then
            echo "::error::.claude/skills/pr-reviewer/SKILL.md is missing on '$BASE_REF'. The review cannot run without it."
            exit 1
          fi

      - name: Review
        id: review
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/pr-reviewer ${{ github.event.pull_request.number }}"
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git show origin/main:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request_changes"]},"blocking_findings":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["verdict","blocking_findings","summary"]}'

      - name: Enforce verdict
        env:
          REVIEW_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: |
          # Fail closed: a missing or malformed verdict counts as request_changes.
          review_output="${REVIEW_OUTPUT:-}"
          [ -n "$review_output" ] || review_output='{}'
          review_verdict=$(jq -r '.verdict // "missing"' <<< "$review_output" 2>/dev/null || echo "missing")
          review_summary=$(jq -r '.summary // ""' <<< "$review_output" 2>/dev/null || echo "")
          echo "Verdict: $review_verdict — $review_summary"
          if [ "$review_verdict" != "approve" ]; then
            echo "::error::agent-review verdict is '$review_verdict'. See the review comments on the PR."
            exit 1
          fi

      - name: Remove the agent:review label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "agent:review"
