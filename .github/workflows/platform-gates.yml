# platform-gates.yml — blocking quality gates for k8s-platform (PR 0 of C1).
# Runs alongside validate-pr.yml until C1 rewrites it. Every gate must pass on
# main before any migration PR lands.
name: Platform gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  placeholder-ratchet:
    name: Placeholder ratchet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash scripts/ci/placeholder-ratchet.sh

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/ci/install-tools.sh
      - name: Scan working tree
        run: gitleaks dir . --no-banner --redact --exit-code 1
      - name: Scan commits introduced by the PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --no-banner --redact --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}"

  manifests:
    name: Charts, schemas and policies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash scripts/ci/install-tools.sh
      - name: Helm lint and render
        run: bash scripts/ci/render-charts.sh
      - name: Kubeconform (strict, CRDs included)
        run: bash scripts/ci/kubeconform-gate.sh
      - name: Kyverno policies on rendered releases
        run: bash scripts/ci/kyverno-gate.sh
