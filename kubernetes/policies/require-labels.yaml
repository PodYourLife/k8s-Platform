# require-labels.yaml
# Requires app, env, and team labels on all Pods for observability and ownership.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-labels
  annotations:
    policies.kyverno.io/title: Require Pod Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      All Pods must carry the app.kubernetes.io/name, app.kubernetes.io/instance,
      app.kubernetes.io/part-of and env labels for consistent observability,
      policy targeting, and ownership tracking.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-standard-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        resources:
          namespaces:
            - kube-system
            - istio-system
            - istio-ingress
            - cert-manager
            - argocd
            - kyverno
            - monitoring
            - finops
            - external-secrets
      validate:
        message: "Pods must have app.kubernetes.io/name, app.kubernetes.io/instance, app.kubernetes.io/part-of and env labels."
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/instance: "?*"
              app.kubernetes.io/part-of: "?*"
              env: "?*"
