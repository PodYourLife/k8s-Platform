# CRD owned by the poc-a0-crd Application. poc-a0-consumer creates a Widget and
# must converge by retry once this CRD exists (ADR-0023 D2, D3).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.poc.podyourlife.io
spec:
  group: poc.podyourlife.io
  scope: Namespaced
  names:
    kind: Widget
    plural: widgets
    singular: widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
